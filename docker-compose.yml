services:
  mysql:
    image: mysql:8.0
    container_name: syncboard-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-syncboard}
      MYSQL_USER: ${MYSQL_USER:-syncuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-syncpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

